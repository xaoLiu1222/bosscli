[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosscli"
version = "0.1.0"
description = "Pure-Python BOSS直聘 toolkit: search, chat, image upload and confirmed recruiter outreach"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weixingyu" }]
keywords = ["bosszhipin", "reverse-engineering", "job-search", "cli", "mqtt", "im"]
dependencies = [
    "requests>=2.28",
    "lz4>=4.0",
    "Pillow>=10.4",
]

[project.optional-dependencies]
# MCP server (python -m bosscli.mcp_server)
mcp = ["mcp>=1.2"]
# login captcha solvers (gt3solver) — heavy, only needed for `bosscli login --solve`
captcha = [
    "patchright>=1.40",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pycryptodome>=3.20",
]

[project.scripts]
bosscli = "bosscli.cli:main"
bosscli-mcp = "bosscli.mcp_server:main"
# Backwards-compatible aliases kept for existing scripts and older docs.
boss = "bosscli.cli:main"
boss-mcp = "bosscli.mcp_server:main"

[project.urls]
Homepage = "https://github.com/1013503897/bosscli"
Repository = "https://github.com/1013503897/bosscli"
Issues = "https://github.com/1013503897/bosscli/issues"

[tool.setuptools]
packages = ["bosscli", "gt3solver"]
